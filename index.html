<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>simple word test</title>
		<style>
body {
	font-family: sans-serif;
	background: #fafafa;
	max-width: 640px;
	margin: 1.5em auto;
	padding: 1em;
	color: #333;
}

	h1 {
		font-size: 1.6em;
		margin-bottom: 0.2em;
	}

	.note {
		font-size: 0.9em;
		color: #666;
		margin-bottom: 1em;
	}

	.box {
		background: white;
		border-radius: 12px;
		padding: 1em;
		margin-bottom: 1em;
		box-shadow: 0 2px 6px rgba(0,0,0,0.06);
	}
	.linkBtn {
		display: inline-block;
		padding: 0.6em 1.2em;
		background: #F3998B;
		border-radius: 10px;
		text-decoration: none;
		color: #333;
	}
	.linkBox {
		display: flex;
		align-items: center;
		gap: 0.8em;
		flex-wrap: wrap;
	}

	.links {
		display: flex;
		gap: 0.4em;
	}

	.linkNote {
		font-size: 0.9em;
		color: #666;
	}

	button {
		font-size: 1.1em;
		padding: 0.6em 1.2em;
		border-radius: 10px;
		border: none;
		background: #ffd6e8;
		cursor: pointer;
		margin: 0.2em 0.2em 0.2em 0;
	}

	button:active {
		background: #ffbfdc;
	}

	#startBtn, #submit {
		width: 100%;
		font-size: 1.2em;
		margin-top: 0.6em;
	}

	#question {
		font-size: 1.4em;
		margin: 0.6em 0;
	}

	#answer {
		width: 95%;
		font-size: 1.1em;
		padding: 0.5em;
	}

	#result {
		margin-top: 0.6em;
		font-size: 1.1em;
		font-weight: bold;
	}

	.ac { color: #2e8b57; }
	.wa { color: #cc3333; }
	.after { opacity: 0.7; }
	@media (max-width: 600px) {
		body {
			padding: 1.2em;
		}

		.linkBtn {
			font-size: 1.1em;
			padding: 0.8em 1.4em;
		}

		button {
			font-size: 1.1em;
			padding: 0.8em 1.4em;
		}

		#answer {
			font-size: 1.2em;
			padding: 0.7em;
		}
	}

		</style>
	</head>
	<body>

		<h1>simple word test</h1>
		<div class="note">
			正誤判定は大文字小文字を区別しないが、完全一致が必要<br>答えを打ち込んでenterを押せばそのまま受理されます<br>すべて終了すると、結果が表示されます
		</div>
		<div class="box linkBox">
			<div class="links">
				<a href="https://github.com/rykazari-h/simple_word_test" target="_blank" class="linkBtn">ソースコード</a>

				<a href="https://github.com/rykazari-h/simple_word_test/blob/main/README.md"
	   target="_blank" class="linkBtn">ドキュメント</a>
			</div>
			<div class="linkNote">
				困ったとき、問題を作りたいときはここ
			</div>
		</div>

		<div class="box">
			<label><input type="radio" name="mode" value="word" checked> 意味 → 単語</label>
			<label><input type="radio" name="mode" value="mean"> 単語 → 意味</label>
			<label><input type="checkbox" id="shuffle"> シャッフル</label>
		</div>

		<div class="box">
			<div>スロット</div>
			<button id="addCell">枠を追加</button>
			<button id="removeCell">枠を削除</button>
			<div id="fileCells"></div>
			<hr>
			<div>インポート</div>
			<select id="exampleSelect">標準問題から選択</select>
			<button id="importExampleBtn">追加</button>
			<input type="file" id="fileInput">
			<hr>
			<button id="startBtn">始める</button>
		</div>

		<div class="box">
			<div id="question">まだ始まっていません</div>
			<input id="answer" disabled>
			<button id="submit" disabled>OK</button>
			<div id="result"></div>
		</div>

		<div class="box" id="summaryBox" style="display:none;">
			<h3>結果</h3>
			<div id="summary"></div>
		</div>

		<script src="script.js"></script>
	</body>
</html>
